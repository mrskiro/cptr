name: CI macOS

on:
  push:
    branches: [main]
    paths:
      - "apps/macos/**"
      - ".github/workflows/ci-macos.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/macos/**"
      - ".github/workflows/ci-macos.yml"

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ hashFiles('apps/macos/app.xcodeproj/project.pbxproj') }}
          restore-keys: spm-

      - run: xcodebuild -project apps/macos/app.xcodeproj -scheme app build CODE_SIGNING_ALLOWED=NO
